# Quality gate for every pull request and every push to main: formatting, lint, the whole test
# suite (unit, integration, regression, mutation smoke), repository checks (assets, layering,
# wasm compile) and a release build. Windows is the supported platform for now, so the jobs run
# there; macOS and Linux get their own jobs in the later phases.
#
# The same gate runs locally with `cargo xtask ci`; `tools/quality/baseline.ps1` records timings.
# Long-running work (large mutation runs, dependency audit, trends) is in cad-nightly.yml so a
# pull request stays fast.
name: CAD CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cad-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  gate:
    name: fmt, clippy, tests, repository checks
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: cargo xtask ci (fmt, clippy -D warnings, tests, assets, layers, wasm)
        run: cargo xtask ci
      - name: Mutation robustness (larger than the in-suite run)
        env:
          AAD_MUTATION_ITERS: "600"
          AAD_MUTATION_SEED: "100000"
        run: cargo test -p aad-io --test mutation_robustness -p aad-cli --test dwg_isolation
      - name: Keep any crash input for reproduction
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: crash-inputs
          path: target/quality/crashes/
          if-no-files-found: ignore

  release-build:
    name: release build
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Release build of the program and the command-line tool
        run: cargo build --release --locked -p aad -p aad-cli -p aad-host
      - name: The command-line tool runs
        run: target/release/aad-cli.exe --version
      - name: WinUI shell build
        shell: pwsh
        run: |
          dotnet build apps/aad-winui/Aad.WinUi.csproj -c Release -p:Platform=x64 -o target/aad-winui
          if (-not (Test-Path target/aad-winui/Aad.WinUi.exe)) { throw 'Aad.WinUi.exe missing' }
          if (-not (Test-Path target/aad-winui/aad_host.dll)) { throw 'aad_host.dll was not copied beside Aad.WinUi.exe' }
