[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
exclude = ["apps/aad-winui"]
# default-members

[workspace.package]
version = "0.6.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.90"
repository = "https://github.com/HolagundiWorks/AAD"

[workspace.dependencies]
# internal
aad-geom = { path = "crates/geom" }
aad-dxf = { path = "crates/dxf" }
aad-dwg = { path = "crates/dwg" }
aad-color = { path = "crates/color" }
aad-doc = { path = "crates/doc" }
aad-fonts = { path = "crates/fonts" }
aad-render = { path = "crates/render" }
aad-io = { path = "crates/io" }
aad-aorms = { path = "crates/aorms" }
aad-office = { path = "crates/office" }
aad-engine = { path = "crates/engine" }
aad-ui-egui = { path = "crates/ui-egui" }
aad-host = { path = "crates/aad-host" }
aad-mcp = { path = "crates/mcp" }
aad-agent = { path = "crates/agent" }
aad-llm = { path = "crates/llm" }
aad-vdb = { path = "crates/vdb" }

# foundation
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
log = "0.4"
rayon = "1"
# Ear-clipping triangulation of glyph outlines (ISC).
earcutr = "0.5"

# rendering / formats
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd", "png-format"] }
skrifa = "0.47"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# ui
craft-ui = { version = "0.1.0", git = "https://github.com/storytold/craft-libs", rev = "5c874d51eeb3de70e735c8ce87a59a7dedd47675", features = ["serde"] }
egui = "0.36"
egui_kittest = "0.36"
eframe = { version = "0.36", default-features = false }
egui-wgpu = "0.36"
rfd = "0.17"
arboard = { version = "3.6", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
debug = 0
