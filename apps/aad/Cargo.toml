[package]
name = "aad"
description = "O-Draft desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
default-run = "aad"

[lints]
workspace = true

[dependencies]
# The AORMS sign-in is kept in the OS credential store (Windows Credential Manager, shared with AQC); in memory only if that fails.
aad-engine = { workspace = true, features = ["aorms-keyring"] }
aad-dwg = { workspace = true }
aad-fonts = { workspace = true }
aad-io = { workspace = true }
aad-agent = { workspace = true }
aad-llm = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
# On Windows, egui/eframe are optional: the default binary only launches WinUI and does not link them.
aad-ui-egui = { workspace = true, optional = true }
eframe = { workspace = true, optional = true, features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11", "links", "persistence"] }
egui = { workspace = true, optional = true }
rfd = { workspace = true, optional = true }

[features]
default = []
# Optional egui/eframe desktop shell on Windows (`aad --egui`). Non-Windows always links egui
# (see target dependencies below); the default Windows build is WinUI-only.
egui = ["dep:aad-ui-egui", "dep:eframe", "dep:egui", "dep:rfd"]
# The local language model runtime (llama.cpp; needs CMake, a C++ toolchain and LLVM libclang).
# Without it the command bar says the build has no model. Build with
# `cargo build -p aad --features assistant` (add `egui` when using the egui shell on Windows).
assistant = ["aad-llm/llama"]

[build-dependencies]
winresource = "0.1"

# macOS/Linux/BSD desktop shell is egui/eframe (WinUI is Windows-only).
[target.'cfg(not(windows))'.dependencies]
aad-ui-egui = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11", "links", "persistence"] }
egui = { workspace = true }
rfd = { workspace = true }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
winit = { version = "0.30", default-features = false, features = ["x11"] }

[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.21", default-features = false }
