[package]
name = "cadcraft-cli"
description = "AAD command-line tool: info, convert, run scripts, export, commands, MCP server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
cadcraft-engine = { workspace = true }
cadcraft-dwg = { workspace = true }
cadcraft-io = { workspace = true }
cadcraft-fonts = { workspace = true }
cadcraft-mcp = { workspace = true }
serde_json = { workspace = true }
cadcraft-agent = { workspace = true }
cadcraft-llm = { workspace = true }

[features]
# The local language model runtime (llama.cpp). Off by default: building it needs CMake, a C++
# toolchain and LLVM's libclang (see docs/BUILD_AND_DEVELOPMENT.md).
assistant = ["cadcraft-llm/llama"]
