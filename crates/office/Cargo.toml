[package]
name = "aad-office"
description = "O-Draft's link to the OSAS company file through office.dll: the company's and the project's details for title blocks"
version.workspace = true
edition.workspace = true
license.workspace = true

# The only code that calls office.dll lives in `link`. It loads the library at run time and speaks its C interface, so O-Draft
# neither links to nor contains the company file's code.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"

[dependencies]
serde_json = { workspace = true }
thiserror = { workspace = true }
