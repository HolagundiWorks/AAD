[package]
name = "aad-io"
description = "AAD file formats: DXF read/write mapping, SVG, PNG and PDF export"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
aad-geom = { workspace = true }
aad-color = { workspace = true }
aad-doc = { workspace = true }
aad-dxf = { workspace = true }
aad-dwg = { workspace = true }
aad-render = { workspace = true }
thiserror = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
miniz_oxide = "0.8"

# Reads the vector paths of a PDF page for the underlay (MIT, pure Rust). Native only: its random-number dependency has no web backend.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
lopdf = { version = "0.45", default-features = false }

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "dxf"
harness = false
