[package]
name = "cadcraft-engine"
description = "AAD engine: sessions, commands, the command line and prompts, snaps, selection, undo"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
# Keep the AORMS sign-in in the OS credential store (Windows Credential Manager, shared with the other AORMS apps). The desktop app enables it.
aorms-keyring = ["cadcraft-aorms/keyring-store"]

[dependencies]
cadcraft-geom = { workspace = true }
cadcraft-color = { workspace = true }
cadcraft-doc = { workspace = true }
cadcraft-fonts = { workspace = true }
cadcraft-render = { workspace = true }
cadcraft-aorms = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
# R-tree spatial index for picking, window selection and object snaps (MIT OR Apache-2.0).
rstar = { version = "0.12", default-features = false }
