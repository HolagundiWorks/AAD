[package]
name = "aadt-render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "GPU-accelerated 2D canvas (wgpu): pan/zoom/redraw for 100k+ entities. Skeleton — built in M1."

[dependencies]
aadt-geometry.workspace = true
aadt-model.workspace = true
# L6 — fill opacities from libraries/materials/catalog.json
aadt-library.workspace = true
# L5 — TrueType outlines for viewport TEXT (line-list backends).
ab_glyph = "0.2"

# GPU canvas backend (spec §4.3 / ADR-0001). Optional so the headless drawlist
# core builds std-only; enable with `--features wgpu`.
wgpu = { version = "30", optional = true }
pollster = { version = "0.4", optional = true }
bytemuck = { version = "1", features = ["derive"], optional = true }
png = { version = "0.17", optional = true }
winit = { version = "0.30", optional = true }

[features]
# The GPU backend and its offscreen PNG export. Off by default: the drawlist,
# camera, interactor, and Renderer trait stay dependency-free and always build.
gpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck", "dep:png"]
# The interactive window (winit surface + live pan/zoom). Implies `gpu` and
# reuses its exact render pipeline.
gui = ["gpu", "dep:winit"]

[lints]
workspace = true
