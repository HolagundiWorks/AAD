[package]
name = "aadt-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Desktop application shell (egui) tying the CAD core, render canvas, and AAD engine together."

[dependencies]
aadt-model.workspace = true
aadt-command.workspace = true
aadt-render.workspace = true
aadt-detect.workspace = true
aadt-geometry.workspace = true
aadt-lisp.workspace = true
aadt-standards.workspace = true
aadt-library.workspace = true
aadt-docs.workspace = true
aadt-pdf.workspace = true
aadt-store.workspace = true
# Spatial index for L1 click pick (also used by gui Server dialog).
aadt-vdb.workspace = true

# The egui desktop shell (ADR-0001). Optional so the headless Session core stays
# dependency-free of windowing; enable with `--features gui`.
eframe = { version = "0.29", optional = true }
egui = { version = "0.29", optional = true }
egui_extras = { version = "0.29", optional = true, default-features = false, features = ["svg"] }
rfd = { version = "0.15", optional = true }
image = { version = "0.25", optional = true, default-features = false, features = ["png", "jpeg", "webp"] }

[features]
gui = ["dep:eframe", "dep:egui", "dep:egui_extras", "dep:rfd", "dep:image", "aadt-pdf/pdfium"]
# L5.2 — open aadt_render::view wgpu window from egui (needs wgpu+winit).
wgpu-canvas = ["gui", "aadt-render/gui"]

[lints]
workspace = true
