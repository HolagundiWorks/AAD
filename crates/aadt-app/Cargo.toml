[package]
name = "aadt-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Desktop application shell (egui/Slint) tying the CAD core, render canvas, and AADT engine together. Skeleton — built from M1."

[dependencies]
aadt-model.workspace = true
aadt-command.workspace = true
aadt-render.workspace = true
aadt-detect.workspace = true
aadt-takeoff.workspace = true
aadt-ai.workspace = true
aadt-geometry.workspace = true

# The egui desktop shell (ADR-0001). Optional so the headless Session core stays
# dependency-free and always builds; enable with `--features gui`. Pinned to a
# stable API line (0.29) rather than the latest, which reworked the App trait.
eframe = { version = "0.29", optional = true }
egui = { version = "0.29", optional = true }

[features]
gui = ["dep:eframe", "dep:egui"]

[lints]
workspace = true
