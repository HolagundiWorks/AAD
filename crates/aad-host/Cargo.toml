[package]
name = "aad-host"
description = "Windows shell host: a session, the canvas mesh, and the C ABI the WinUI app calls"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"

[lib]
name = "aad_host"
crate-type = ["cdylib", "rlib"]

[dependencies]
aad-color = { workspace = true }
aad-engine = { workspace = true }
aad-fonts = { workspace = true }
aad-io = { workspace = true }
aad-geom = { workspace = true }
aad-render = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
pollster = "0.4"
raw-window-handle = "0.6"
wgpu = "30"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
