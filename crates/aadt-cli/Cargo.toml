[package]
name = "aadt-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "AADT command-line driver: headless entry point for the takeoff pipeline, batch runs, and tests."

[[bin]]
name = "aadt"
path = "src/main.rs"

[dependencies]
aadt-app.workspace = true
aadt-model.workspace = true
aadt-command.workspace = true
aadt-dxf.workspace = true
aadt-detect.workspace = true
aadt-takeoff.workspace = true
aadt-ai.workspace = true
aadt-docs.workspace = true
aadt-lisp.workspace = true
aadt-pdf.workspace = true
aadt-collab.workspace = true
aadt-geometry.workspace = true
aadt-render = { workspace = true, optional = true }

[features]
# The `aadt render` command — GPU canvas → PNG. Off by default so the standard
# CLI stays std-only; enable with `--features gpu`.
gpu = ["dep:aadt-render", "aadt-render/gpu"]
# The `aadt view` command — interactive window. Implies `gpu`.
gui = ["gpu", "aadt-render/gui"]
# The `aadt app` command — the egui desktop shell (ADR-0001).
app = ["aadt-app/gui"]

[lints]
workspace = true
