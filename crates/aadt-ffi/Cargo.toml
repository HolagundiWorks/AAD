[package]
name = "aadt-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Thin C ABI over aadt-app::Session for future chrome (e.g. WinUI) — no UI here."

[lib]
crate-type = ["cdylib", "rlib"]
name = "aadt_ffi"

[dependencies]
aadt-app.workspace = true
aadt-command.workspace = true
aadt-model.workspace = true

[lints.rust]
# C ABI requires unsafe extern "C" and pointer handling; engine crates stay forbid.
unsafe_code = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
