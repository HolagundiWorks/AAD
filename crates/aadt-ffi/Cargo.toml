[package]
name = "aadt-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "C ABI over aadt-app::Session for WinUI / native chrome (ADR-0017) — no UI here."

[lib]
crate-type = ["cdylib", "rlib"]
name = "aadt_ffi"

[dependencies]
aadt-app.workspace = true
aadt-cli.workspace = true
aadt-command.workspace = true
aadt-docs.workspace = true
aadt-geometry.workspace = true
aadt-library.workspace = true
aadt-model.workspace = true
aadt-pdf.workspace = true
aadt-render.workspace = true
aadt-vdb.workspace = true

[lints.rust]
# C ABI requires unsafe extern "C" and pointer handling; engine crates stay forbid.
unsafe_code = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
