[package]
name = "aad-render"
description = "AAD rendering: display lists (linetypes, hatches, text, blocks, dimensions) and a CPU rasteriser"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
aad-geom = { workspace = true }
aad-color = { workspace = true }
aad-doc = { workspace = true }
aad-fonts = { workspace = true }
tiny-skia = { workspace = true }
rayon = { workspace = true }
earcutr = { workspace = true }

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
serde_json = { workspace = true }

[[bench]]
name = "render"
harness = false
